name: Controller Windows artifact
run-name: Controller Windows artifact - ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLATFORM: amd64-windows
  BUILD_DIR: build-windows
  LOG_DIR: ci-windows-logs

jobs:
  windows-artifact:
    name: Windows amd64 engine artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare log directory
        shell: bash
        run: mkdir -p "$LOG_DIR"

      - name: Build Windows amd64 with Docker build v2
        shell: bash
        env:
          CONTAINER_RUNTIME_EXTRA_ARGS: "-e CI=true -e GITHUB_ACTIONS=true"
        run: |
          set -euo pipefail
          docker version
          script -q -e -c "bash docker-build-v2/build.sh -j $(nproc) windows" "$LOG_DIR/build-amd64-windows.log"

      - name: Gather build logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"

          {
            echo "Controller Windows artifact build"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Platform: $PLATFORM"
            echo "Build directory: $BUILD_DIR"
            echo
            echo "Selected build outputs:"
            find "$BUILD_DIR" -maxdepth 3 -type f \
              \( -name 'spring.exe' -o -name '*.dll' -o -name '.ninja_log' -o -name 'CMakeCache.txt' \) \
              -print 2>/dev/null || true
            echo
            echo "Install directory preview:"
            find "$BUILD_DIR/install" -maxdepth 2 -type f -print 2>/dev/null | head -200 || true
          } > "$LOG_DIR/artifact-summary.txt"

          for file in \
            "$BUILD_DIR/CMakeCache.txt" \
            "$BUILD_DIR/CMakeFiles/CMakeOutput.log" \
            "$BUILD_DIR/CMakeFiles/CMakeError.log" \
            "$BUILD_DIR/.ninja_log"
          do
            if [[ -f "$file" ]]; then
              cp "$file" "$LOG_DIR/$(basename "$file")"
            fi
          done

      - name: Upload Windows build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-windows-build-logs-${{ github.sha }}
          path: ${{ env.LOG_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows install artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: recoil-controller-${{ env.PLATFORM }}-${{ github.sha }}
          path: ${{ env.BUILD_DIR }}/install
          if-no-files-found: error
          retention-days: 14
