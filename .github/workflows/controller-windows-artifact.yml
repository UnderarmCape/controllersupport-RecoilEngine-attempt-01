name: Controller Windows artifact

on:
  workflow_dispatch:
  push:
    branches:
      - research/controller-api-investigation
      - research/controller-api-2025-06-19

permissions:
  contents: read

env:
  PLATFORM: amd64-windows
  BUILD_DIR: build-windows
  CACHE_DIR: .cache/ccache-windows
  LOG_DIR: ci-windows-logs

jobs:
  windows-artifact:
    name: Windows amd64 engine artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare directories
        shell: bash
        run: mkdir -p "$BUILD_DIR" "$CACHE_DIR" "$LOG_DIR"

      - name: Resolve Docker build image
        id: resolve-image
        shell: bash
        run: |
          set -euo pipefail
          source docker-build-v2/images_versions.sh
          image="ghcr.io/beyond-all-reason/recoil-build-${PLATFORM}@${image_version[$PLATFORM]}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Using $image"

      - name: Pull Docker build image
        shell: bash
        run: docker pull "${{ steps.resolve-image.outputs.image }}"

      - name: Build Windows amd64 directly in Docker
        shell: bash
        run: |
          set -euo pipefail
          docker version

          docker run -i --rm \
            -v /etc/passwd:/etc/passwd:ro \
            -v /etc/group:/etc/group:ro \
            --user="$(id -u):$(id -g)" \
            -v "$PWD":/build/src:ro \
            -v "$PWD/$CACHE_DIR":/build/cache:rw \
            -v "$PWD/$BUILD_DIR":/build/out:rw \
            -v "$PWD/$LOG_DIR":/build/logs:rw \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e CONFIGURE=true \
            -e COMPILE=true \
            -e CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)" \
            "${{ steps.resolve-image.outputs.image }}" \
            bash <<'EOF'
          set -euo pipefail
          cd /build/src/docker-build-v2/scripts

          ./configure.sh 2>&1 | tee /build/logs/configure.log
          ./compile.sh 2>&1 | tee /build/logs/build-windows.log

          if [[ "${ENGINE_PLATFORM:-}" =~ .*windows ]]; then
            ./split-debug-info.sh 2>&1 | tee /build/logs/split-debug-info.log
          fi
          EOF

      - name: Gather build logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"

          {
            echo "Controller Windows artifact build"
            echo "Commit: $GITHUB_SHA"
            echo "Platform: $PLATFORM"
            echo "Docker image: ${{ steps.resolve-image.outputs.image }}"
            echo "Build directory: $BUILD_DIR"
            echo
            echo "Selected build outputs:"
            find "$BUILD_DIR" -maxdepth 3 -type f \
              \( -name 'spring.exe' -o -name '*.dll' -o -name '.ninja_log' -o -name 'CMakeCache.txt' \) \
              -print 2>/dev/null || true
            echo
            echo "Install directory preview:"
            find "$BUILD_DIR/install" -maxdepth 2 -type f -print 2>/dev/null | head -200 || true
          } > "$LOG_DIR/artifact-summary.txt"

          for file in \
            "$BUILD_DIR/CMakeCache.txt" \
            "$BUILD_DIR/CMakeFiles/CMakeOutput.log" \
            "$BUILD_DIR/CMakeFiles/CMakeError.log" \
            "$BUILD_DIR/.ninja_log"
          do
            if [[ -f "$file" ]]; then
              cp "$file" "$LOG_DIR/$(basename "$file")"
            fi
          done

      - name: Upload Windows build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-windows-build-logs-${{ github.sha }}
          path: ${{ env.LOG_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows install artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: recoil-controller-${{ env.PLATFORM }}-${{ github.sha }}
          path: ${{ env.BUILD_DIR }}/install
          if-no-files-found: error
          retention-days: 14